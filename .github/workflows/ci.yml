name: CI

on:
  push:
    branches: [master]
  pull_request:

# One in-flight run per ref; keep the latest.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  # Tests + workspace build (protocol, common, api, pskrep, ui).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain + targets
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: test

      - name: Run tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Release build
        run: cargo build --workspace --release

  # WASM UI, built with Trunk against the browser target.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain + wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ui

      - name: Install Trunk
        run: cargo install trunk --locked

      - name: Build UI (Trunk)
        working-directory: ui
        run: trunk build --release

  # Teensy 4.x firmware, a standalone no_std crate for the Cortex-M target.
  teensy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain + thumb target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: teensy

      - name: Build firmware
        working-directory: teensy
        run: cargo build --release
