[package]
name = "hl2-teensy"
version = "0.1.0"
edition = "2024"

# `no_std` lib (spectrum, display, radio) shared by the tests + the RTIC bin.
[lib]
name = "hl2_teensy"
path = "src/lib.rs"
crate-type = ["lib"]

[dependencies]
hl2 = { path = "../hl2", default-features = false, features = ["dsp"] }
num-traits = { version = "0.2", default-features = false, features = ["libm"] }
num-complex = { version = "0.4", default-features = false }
rtic = { version = "2", features = ["thumbv7-backend"] }
rtic-monotonics = { version = "1", default-features = false, features = ["cortex-m-systick", "systick-64bit"] }
ili9341 = "0.6.0"
display-interface-spi = "0.5.0"
embedded-hal = { version = "1.0.0", default-features = false }
cortex-m = { version = "0.7", default-features = false }
imxrt-log = { version = "0.2", default-features = false, features = ["log", "usbd"] }
log = { version = "0.4", features = ["max_level_debug", "release_max_level_info"] }
# The binary provides a panic handler that flushes USB logs before SOS.
teensy4-panic = { version = "0.3", default-features = false }
imxrt-enet = "=0.1.0"
smoltcp = { version = "0.13.0", default-features = false, features = ["proto-ipv4", "proto-dhcpv4", "socket-raw", "socket-udp", "socket-dhcpv4", "multicast"] }
static_cell = "2.1.1"
wm8731 = "0.1.0"
# Pad configuration for I2C SDA/SCL pull-ups (version matches the transitive
# copy through `teensy4-bsp` so we share a single compiled instance).
imxrt-iomuxc = "0.3"

[dependencies.teensy4-bsp]
version = "0.6"
features = [
    "rt",
]

# The firmware sits right at the BSP's 192 KiB ITCM limit (`.text`). Keep
# debug assertions, but optimize like release and drop DWARF: `.text` needs
# O3 + thin LTO + `codegen-units = 1` to fit the 192 KiB ITCM once the
# encoder + ISR plumbing is linked (O2 overflows by ~3.7 KiB, thin LTO alone
# doesn't collapse it). `debug = 0` matches the release setup that links.
[profile.dev]
opt-level = 3
lto = "thin"
debug = 0
codegen-units = 1

# Don't optimize build dependencies, like proc macros.
# Helps with build times.
[profile.release.build-override]
opt-level = 0
